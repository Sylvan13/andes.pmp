<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Board — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-dark:#151A21;
    --ivory:#F3F1EA;
    --amber:#C98A3E;
    --amber-soft: rgba(201,138,62,0.16);
    --slate:#6B7280;
    --green:#4C9A72;
    --line: rgba(243,241,234,0.10);
    --card-shadow: 0 24px 60px -20px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--ivory);
    color:#1C2127;
    display:flex;
    min-height:100vh;
  }
  .brand-panel{
    flex:1 1 46%;
    background:
      radial-gradient(circle at 18% 22%, rgba(201,138,62,0.10), transparent 40%),
      var(--bg-dark);
    color:var(--ivory);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:56px 56px 48px;
    position:relative;
    overflow:hidden;
    min-height:100vh;
  }
  .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .wordmark .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    display:inline-block;
  }
  .brand-copy{
    max-width:420px;
  }
  .brand-copy h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(28px,3.2vw,38px);
    line-height:1.18;
    margin:0 0 18px;
    letter-spacing:-0.01em;
  }
  .brand-copy p{
    font-size:15.5px;
    line-height:1.6;
    color:rgba(243,241,234,0.62);
    margin:0;
  }
  /* Step sequence signature element */
  .step-track{
    display:flex;
    align-items:center;
    gap:0;
    margin:40px 0 44px;
  }
  .step-node{
    width:11px;height:11px;border-radius:50%;
    background:rgba(243,241,234,0.16);
    border:1.5px solid rgba(243,241,234,0.22);
    flex-shrink:0;
    position:relative;
    transition:background .5s ease, border-color .5s ease, box-shadow .5s ease;
  }
  .step-node.active{
    background:var(--amber);
    border-color:var(--amber);
    box-shadow:0 0 0 5px var(--amber-soft);
  }
  .step-node.done{
    background:var(--green);
    border-color:var(--green);
  }
  .step-connector{
    width:46px;height:1.5px;
    background:rgba(243,241,234,0.14);
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .step-connector .fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--amber);
    transition:width .6s ease;
  }
  .step-labels{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color:rgba(243,241,234,0.4);
    text-transform:uppercase;
    letter-spacing:0.06em;
    max-width:420px;
    margin-top:-32px;
    margin-bottom:8px;
  }
  .foot-note{
    font-size:12.5px;
    color:rgba(243,241,234,0.34);
    letter-spacing:0.01em;
  }

  .form-panel{
    flex:1 1 54%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 32px;
  }
  .form-card{
    width:100%;
    max-width:380px;
  }
  .form-card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .form-card .sub{
    color:var(--slate);
    font-size:14px;
    margin:0 0 32px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:#3A4049;
    margin-bottom:6px;
  }
  .field{margin-bottom:18px;}
  input[type=email], input[type=password]{
    width:100%;
    padding:12px 14px;
    border-radius:9px;
    border:1.5px solid #E3DFD3;
    background:#FBFAF6;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:#1C2127;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus{
    border-color:var(--amber);
    background:#fff;
  }
  input:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:1px;
  }
  .btn-primary{
    width:100%;
    padding:12.5px;
    border:none;
    border-radius:9px;
    background:#1C2127;
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    margin-top:6px;
  }
  .btn-primary:hover{background:#282f38;}
  .btn-primary:active{transform:scale(0.99);}
  .btn-primary:disabled{background:#9AA0A8; cursor:not-allowed;}
  .btn-primary:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:24px 0;
    color:var(--slate);
    font-size:12.5px;
  }
  .divider::before,.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:#E3DFD3;
  }
  .btn-google{
    width:100%;
    padding:11px;
    border-radius:9px;
    border:1.5px solid #E3DFD3;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    color:#1C2127;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-google:hover{border-color:#C7C2B3; background:#FBFAF6;}
  .btn-google:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  .msg{
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:16px;
    display:none;
  }
  .msg.show{display:block;}
  .msg.error{background:#FBEAE6; color:#A23E1E;}
  .msg.success{background:#E9F3EE; color:#2E6A4B;}

  .toggle-row{
    text-align:center;
    margin-top:22px;
    font-size:13.5px;
    color:var(--slate);
  }
  .toggle-row button{
    background:none; border:none;
    color:var(--amber);
    font-weight:600;
    cursor:pointer;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    padding:0;
  }

  @media (max-width: 860px){
    body{flex-direction:column;}
    .brand-panel{min-height:auto; padding:36px 28px 32px;}
    .step-labels{max-width:100%;}
    .form-panel{padding:36px 24px 56px;}
  }

  @media (prefers-reduced-motion: reduce){
    .step-node, .step-connector .fill{transition:none;}
  }
</style>
</head>
<body>

  <div class="brand-panel">
    <div class="wordmark"><span class="dot"></span>Progress Board</div>

    <div>
      <div class="brand-copy">
        <h1>Work moves forward<br>one approved step at a time.</h1>
        <p>Every project follows its own pipeline — defined by its lead, reviewed by the right people, with nothing skipped and nothing lost.</p>
      </div>

      <div class="step-track" id="stepTrack">
        <div class="step-node done"></div>
        <div class="step-connector"><div class="fill" id="fill1"></div></div>
        <div class="step-node" id="node2"></div>
        <div class="step-connector"><div class="fill" id="fill2"></div></div>
        <div class="step-node" id="node3"></div>
        <div class="step-connector"><div class="fill" id="fill3"></div></div>
        <div class="step-node" id="node4"></div>
      </div>
    </div>

    <div class="foot-note">Sylvan · Namora</div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <h2 id="formTitle">Sign in</h2>
      <p class="sub" id="formSub">Enter your workspace to view your projects.</p>

      <div class="msg error" id="errorMsg"></div>
      <div class="msg success" id="successMsg"></div>

      <form id="authForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@company.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div class="divider">or</div>

      <button class="btn-google" id="googleBtn">
        <svg width="17" height="17" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="toggle-row">
        <span id="toggleText">New here?</span>
        <button type="button" id="toggleBtn">Create an account</button>
      </div>
    </div>
  </div>

<script>
  // ---- Supabase connection ----
  const SUPABASE_URL = "https://aivndpvohshautonthvl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7gxqWOylDt8Yo1Ct8RMZGg_E-bV4795";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- Ambient step animation (decorative, not tied to real data) ----
  (function animateSteps(){
    const nodes = [document.getElementById('node2'), document.getElementById('node3'), document.getElementById('node4')];
    const fills = [document.getElementById('fill1'), document.getElementById('fill2'), document.getElementById('fill3')];
    let i = 0;
    function step(){
      if(i > 0) nodes[i-1].classList.remove('active');
      if(i < nodes.length){
        fills[i].style.width = '100%';
        setTimeout(()=>{ nodes[i].classList.add('active'); }, 550);
      }
      i++;
      if(i > nodes.length){
        setTimeout(()=>{
          nodes.forEach(n=>n.classList.remove('active'));
          fills.forEach(f=>f.style.width='0%');
          i = 0;
          setTimeout(step, 700);
        }, 1600);
        return;
      }
      setTimeout(step, 1400);
    }
    step();
  })();

  // ---- Auth logic ----
  let mode = 'signin'; // 'signin' | 'signup'
  const form = document.getElementById('authForm');
  const submitBtn = document.getElementById('submitBtn');
  const toggleBtn = document.getElementById('toggleBtn');
  const toggleText = document.getElementById('toggleText');
  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  function clearMsgs(){
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
  }
  function showError(text){
    clearMsgs();
    errorMsg.textContent = text;
    errorMsg.classList.add('show');
  }
  function showSuccess(text){
    clearMsgs();
    successMsg.textContent = text;
    successMsg.classList.add('show');
  }

  toggleBtn.addEventListener('click', () => {
    clearMsgs();
    if(mode === 'signin'){
      mode = 'signup';
      formTitle.textContent = 'Create your account';
      formSub.textContent = 'You\u2019ll be added to projects by your workspace owner.';
      submitBtn.textContent = 'Create account';
      toggleText.textContent = 'Already have an account?';
      toggleBtn.textContent = 'Sign in';
    } else {
      mode = 'signin';
      formTitle.textContent = 'Sign in';
      formSub.textContent = 'Enter your workspace to view your projects.';
      submitBtn.textContent = 'Sign in';
      toggleText.textContent = 'New here?';
      toggleBtn.textContent = 'Create an account';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsgs();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signin' ? 'Signing in…' : 'Creating account…';

    try{
      if(mode === 'signin'){
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if(error) throw error;
        showSuccess('Signed in — redirecting…');
        // window.location.href = 'dashboard.html'; // wire up once dashboard exists
      } else {
        const { error } = await supabase.auth.signUp({ email, password });
        if(error) throw error;
        showSuccess('Account created. Check your email to confirm, then sign in.');
      }
    } catch(err){
      showError(err.message || 'Something went wrong. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
    }
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    clearMsgs();
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
    if(error) showError(error.message);
  });
</script>
</body>
</html>
